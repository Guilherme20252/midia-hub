<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar | Mídia Hub</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="auth-box">
      <h1>Mídia Hub</h1>
      <h2 id="auth-title">Entrar</h2>

      <form id="auth-form">
        <input type="text" id="name" placeholder="Seu nome" hidden />
        <input type="email" id="email" placeholder="E-mail" required />
        <input type="password" id="password" placeholder="Senha (mín. 6 caracteres)" required />
        <button type="submit" id="submit-btn">Entrar</button>
        <p id="auth-error" class="auth-error" hidden></p>
      </form>

      <p>
        <span id="toggle-text">Não tem conta?</span>
        <a href="#" id="toggle-mode">Cadastre-se</a>
      </p>
    </main>

    <script src="js/api.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
