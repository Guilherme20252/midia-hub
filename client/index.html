<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mídia Hub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>Mídia Hub</h1>
    <nav>
      <a href="#search">Buscar</a>
      <a href="#library">Biblioteca</a>
      <a href="#dashboard">Dashboard</a>
    </nav>
  </header>

    <main>
    <section id="search">
      <form id="search-form">
        <input type="text" id="query" placeholder="Busque filmes, séries ou jogos..." required>
        <select id="type">
          <option value="movie">Filmes</option>
          <option value="tv">Séries</option>
          <option value="game">Jogos</option>
        </select>
        <button type="submit">Buscar</button>
      </form>
      <div id="results" class="grid"></div>
    </section>

    <section id="library">
      <h2>Minha biblioteca</h2>
      <div class="filters">
        <select id="filter-status">
          <option value="">Todos os status</option>
          <option value="want">Quero ver/Jogar</option>
          <option value="in_progress">Em andamento</option>
          <option value="done">Concluído</option>
        </select>
        <select id="filter-type">
          <option value="">Todos os tipos</option>
          <option value="movie">Filmes</option>
          <option value="tv">Séries</option>
          <option value="game">Jogos</option>
        </select>
      </div>
      <div id="library-list" class="grid"></div>
    </section>
  </main>


  <script src="js/app.js"></script>
</body>
</html>
